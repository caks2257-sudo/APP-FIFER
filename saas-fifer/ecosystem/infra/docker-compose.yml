version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fifer_postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: fifer_db
    ports:
      - "5432:5432"
    volumes:
      - fifer_pg_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: fifer_redis
    ports:
      - "6379:6379"
    volumes:
      - fifer_redis_data:/data
    restart: unless-stopped

volumes:
  fifer_pg_data:
  fifer_redis_data:
